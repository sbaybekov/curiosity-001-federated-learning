[project]
name = "curiosity-001-federated-learning"
version = "0.1.0"
description = "Cross-silo federated learning vs classical training for small-molecule ADMET/toxicity prediction."
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.10",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedlearn"]

[tool.uv]
package = true