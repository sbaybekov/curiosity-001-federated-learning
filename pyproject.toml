[project]
name = "curiosity-001-federated-learning"
version = "0.1.0"
description = "Cross-silo federated learning vs classical training for small-molecule ADMET/toxicity prediction."
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.10",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "rdkit>=2023.9",
    "umap-learn>=0.5",
    "flwr[simulation]>=1.8,<2",
    "hydra-core>=1.3",
    "mlflow>=2.12",
    "pytdc>=0.4",
    # PyTDC still imports pkg_resources, which setuptools >= 81 removed —
    # pin below 81 so the download stage keeps working.
    "setuptools>=70,<81",
    # Stretch (NOT core): torch + torch-geometric + chemprop only if / when the
    # ChemProp GNN drop-in is added. Deliberately not installed by default.
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedlearn"]

[tool.uv]
package = true
managed = false